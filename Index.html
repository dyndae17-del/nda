                        linear-gradient(90deg, #E5E7EB 1px, transparent 1px);

      display: none;
    }
    .no-scrollbar {

    /* Custom Animations */

      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseNode {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }

    .node-selected {
      animation: pulseNode 1.6s infinite ease-in-out;

      init() {
        try {
          const saved = localStorage.getItem(this.KEY);
          if (saved) {
            this.state = JSON.parse(saved);
          } else {
            this.state = JSON.parse(JSON.stringify(DEFAULT_DATA));
            this.save();
          }
        } catch (e) {
          console.error('Storage init error:', e);
          this.state = JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
      },

      save() {
        try {
          localStorage.setItem(this.KEY, JSON.stringify(this.state));
        } catch (e) {
          console.error('Storage save error:', e);
        }
      },

      reset() {
        this.state = JSON.parse(JSON.stringify(DEFAULT_DATA));
        this.save();
      }
    };

      renderChart() {

        if (!ctx) return;
        if (this.chartInstance) this.chartInstance.destroy();

        this.chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'],
            datasets: [{
              label: 'Menit Belajar',
              data: Storage.state.profile.weeklyMinutes,
              backgroundColor: ['#35AAA9', '#FFB65E', '#B892FF', '#35AAA9', '#FFB65E', '#35AAA9', '#B892FF'],
              borderColor: '#12131A',
              borderWidth: 2,
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, grid: { color: '#E5E7EB' }, ticks: { font: { family: 'Plus Jakarta Sans', weight: 'bold', size: 11 } } },
              x: { grid: { display: false }, ticks: { font: { family: 'Plus Jakarta Sans', weight: 'bold', size: 11 } } }
            }
          }

      }

    /**

        Storage.save();

        this.render();

        return Storage.state.materials.find(m => m.id === this.currentId);
      },

        const m = this.getMaterial();
        if (!m) return App.navigate('dashboard');

        const st = UI.getCategoryStyle(m.category);

              <div class="flex items-center gap-2">
                <button onclick="MateriDetail.toggleComplete()" class="neo-btn ${m.progress === 100 ? 'bg-emerald-400 text-ink' : 'bg-white text-ink'} px-3.5 py-2 text-xs flex items-center gap-1.5">

                  <i data-lucide="trash-2" class="w-4 h-4"></i>

                    <span class="text-xs font-bold text-gray-700">Progres: ${m.progress}%</span>

                  <h1 class="font-display font-bold text-xl sm:text-2xl leading-snug">${m.title}</h1>

                </div>
                <button onclick="MateriDetail.editHeaderModal()" class="neo-btn bg-white p-2 text-xs shrink-0" title="Edit Judul & Deskripsi">
                  <i data-lucide="pencil" class="w-4 h-4"></i>

            </div>

            <!-- Sub-navigation Tabs inside Ruang Belajar -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
              ${[
                { id: 'materi', label: '1. Materi Lengkap', icon: 'book-open' },

                { id: 'diagram', label: '3. Diagram Interaktif', icon: 'network' },
                { id: 'latihan', label: '4. Latihan & Pembahasan', icon: 'help-circle' },
                { id: 'video', label: '5. Video Belajar', icon: 'youtube' }
              ].map(t => `
                <button onclick="MateriDetail.setTab('${t.id}')"
                  class="px-3.5 py-2 rounded-xl text-xs font-extrabold border-2 border-ink whitespace-nowrap flex items-center gap-1.5 transition ${this.activeTab === t.id ? `${st.bg} ${m.category === 'TWK' ? 'text-white' : 'text-ink'} shadow-[2px_2px_0px_#12131A]` : 'bg-white text-ink hover:bg-gray-50'}">
                  <i data-lucide="${t.icon}" class="w-3.5 h-3.5"></i> ${t.label}
                </button>
              `).join('')}
            </div>

            <!-- TAB CONTENT -->
            <div id="materi-tab-content">
              ${this.renderTabContent(m, st)}
            </div>
          </div>
        `;

        lucide.createIcons();
      },

      setTab(tab) {
        this.activeTab = tab;
        this.render();
      },

      toggleComplete() {
        const m = this.getMaterial();
        if (m.progress === 100) {
          m.progress = 50;
          m.status = 'sedang';
          UI.toast('Status diubah menjadi Sedang Dipelajari', 'warn');
        } else {
          m.progress = 100;
          m.status = 'selesai';
          UI.toast('Selamat! Materi ditandai selesai 100%');
        }
        Storage.save();
        this.render();
      },

      // Render 5 Tabs
      renderTabContent(m, st) {
        if (this.activeTab === 'materi') {
          return `
            <div class="space-y-4">
              ${this.renderEditableListSection(m, 'objectives', '3. Tujuan Pembelajaran', 'target', 'bg-white')}
              ${this.renderEditableListSection(m, 'keyPoints', '4. Poin-Poin Kunci', 'key', 'bg-twkLight')}
              ${this.renderEditableListSection(m, 'explanation', '5. Penjelasan Materi Secara Sistematis', 'file-text', 'bg-white')}
              ${this.renderEditableListSection(m, 'examExamples', '6. Contoh Penerapan dalam Soal CPNS', 'award', 'bg-tiuLight')}
              ${this.renderEditableListSection(m, 'tipsTricks', '7. Tips dan Trik Mengerjakan Soal', 'zap', 'bg-emerald-50')}
              ${this.renderEditableListSection(m, 'commonMistakes', '8. Kesalahan Umum yang Harus Dihindari', 'alert-triangle', 'bg-red-50')}
              ${this.renderEditableListSection(m, 'summary', '9. Rangkuman Materi', 'clipboard-check', 'bg-tkpLight')}
            </div>
          `;
        }

        if (this.activeTab === 'visual') {
          return this.renderVisualNotesTab(m, st);
        }

        if (this.activeTab === 'diagram') {
          return this.renderInteractiveDiagramTab(m, st);
        }

        if (this.activeTab === 'latihan') {
          return this.renderPracticeTab(m, st);
        }

        if (this.activeTab === 'video') {
          return this.renderVideoTab(m, st);
        }
      },

      // Helper: Editable Section for Items 3 to 9 (Edit via Enter-separated lines, Add item, Delete item)
      renderEditableListSection(m, fieldKey, sectionTitle, iconName, bgClass) {
        const items = m[fieldKey] || [];
        return `
          <div class="neo-card p-4 ${bgClass}">
            <div class="flex items-center justify-between gap-2 mb-3">
              <h3 class="font-display font-bold text-sm sm:text-base flex items-center gap-2">

              </div>
            </div>

              <p class="text-xs text-gray-500 italic">Belum ada isi. Klik "Edit (Per Baris)" untuk menambahkan.</p>

                    <button onclick="MateriDetail.deleteListItem('${fieldKey}', ${idx})" class="text-red-500 hover:bg-red-100 p-1 rounded-lg shrink-0" title="Hapus poin ini">

                    </button>
                  </li>
                `).join('')}
              </ul>
            `}
          </div>
        `;
      },

      openListEditorModal(fieldKey, sectionTitle) {
        const m = this.getMaterial();
        const currentText = (m[fieldKey] || []).join('\n');
        UI.openModal(`
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="font-display font-bold text-base">${sectionTitle}</h3>
              <button onclick="UI.closeModal()" class="p-1 rounded-lg hover:bg-gray-100"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-xs text-gray-600">Pisahkan setiap poin/paragraf dengan <strong>baris baru (Enter)</strong>. Anda dapat menambah, mengubah, atau menghapus baris secara langsung.</p>
            <textarea id="modal-list-textarea" rows="8" class="neo-input w-full text-xs sm:text-sm leading-relaxed" placeholder="Tulis poin pertama...\nTulis poin kedua...">${currentText}</textarea>
            <div class="flex justify-end gap-2">
              <button onclick="UI.closeModal()" class="neo-btn bg-white px-4 py-2 text-xs">Batal</button>

            </div>
          </div>
        `);
      },

      saveListEditor(fieldKey) {
        const m = this.getMaterial();
        const raw = document.getElementById('modal-list-textarea').value;
        m[fieldKey] = raw.split('\n').map(s => s.trim()).filter(Boolean);
        Storage.save();
        UI.closeModal();
        UI.toast('Konten berhasil diperbarui!');
        this.render();
      },

      deleteListItem(fieldKey, idx) {
        const m = this.getMaterial();
        m[fieldKey].splice(idx, 1);
        Storage.save();
        UI.toast('Item dihapus', 'warn');
        this.render();
      },

      editHeaderModal() {
        const m = this.getMaterial();
        UI.openModal(`
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="font-display font-bold text-base">Edit Judul & Deskripsi Materi</h3>
              <button onclick="UI.closeModal()" class="p-1 rounded-lg hover:bg-gray-100"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="space-y-3">
              <div>
                <label class="text-xs font-bold block mb-1">Kategori Subtes</label>
                <select id="edit-mat-cat" class="neo-input w-full text-xs font-bold">
                  <option value="TWK" ${m.category === 'TWK' ? 'selected' : ''}>TWK — Tes Wawasan Kebangsaan</option>
                  <option value="TIU" ${m.category === 'TIU' ? 'selected' : ''}>TIU — Tes Intelegensia Umum</option>

                </select>
              </div>
              <div>
                <label class="text-xs font-bold block mb-1">1. Judul Materi</label>

              </div>
              <div>
                <label class="text-xs font-bold block mb-1">2. Deskripsi Singkat</label>
                <textarea id="edit-mat-desc" rows="3" class="neo-input w-full text-xs sm:text-sm">${m.shortDesc}</textarea>
              </div>
            </div>
            <div class="flex justify-end gap-2">
              <button onclick="UI.closeModal()" class="neo-btn bg-white px-4 py-2 text-xs">Batal</button>
              <button onclick="MateriDetail.saveHeaderEdit()" class="neo-btn bg-twk text-white px-4 py-2 text-xs">Simpan</button>
            </div>
          </div>
        `);
      },

      saveHeaderEdit() {
        const m = this.getMaterial();
        const title = document.getElementById('edit-mat-title').value.trim();
        const desc = document.getElementById('edit-mat-desc').value.trim();
        const cat = document.getElementById('edit-mat-cat').value;
        if (!title) return UI.toast('Judul materi tidak boleh kosong', 'error');
        m.title = title;
        m.shortDesc = desc;
        m.category = cat;
        Storage.save();
        UI.closeModal();
        UI.toast('Identitas materi diperbarui!');
        this.render();
      },

      deleteMaterial(id) {
        UI.confirmDialog(
          "Hapus Modul Materi?",
          "Modul materi ini beserta catatan visual, diagram, dan latihan di dalamnya akan dihapus permanen.",
          () => {
            Storage.state.materials = Storage.state.materials.filter(x => x.id !== id);
            Storage.save();
            UI.toast('Materi berhasil dihapus', 'warn');
            App.navigate('dashboard');
          },
          "Ya, Hapus Materi"

                    </div>

              </div>
            </div>

          const syl = vn.syllogism || {};
          categoryVisualBlock = `
            <div class="neo-card p-4 notebook-grid space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="font-display font-bold text-base flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full bg-tiu border border-ink"></span> Kartu Logika & Silogisme TIU
                </h3>

                  <span class="text-[10px] font-extrabold uppercase text-gray-500">Premis 1</span>
                  <p class="text-xs sm:text-sm font-semibold mt-1">${syl.premis1 || '-'}</p>

                <div class="neo-card-sm p-3 bg-white">

      saveCustomTable(tIdx) {
        const vn = this.getMaterial().visualNotes;
        vn.tables = vn.tables || [];
        const title = document.getElementById('tbl-new-title').value.trim() || 'Tabel Kustom';
        const headers = document.getElementById('tbl-new-headers').value.split(',').map(s => s.trim()).filter(Boolean);
        const rowsRaw = document.getElementById('tbl-new-rows').value.split('\n').map(l => l.trim()).filter(Boolean);
        const rows = rowsRaw.map(line => {
          const cells = line.split('|').map(c => c.trim());
          while (cells.length < headers.length) cells.push('-');
          return cells.slice(0, headers.length);
        });

        if (tIdx === -1) vn.tables.push({ id: 'tbl-' + Date.now(), title, headers, rows });
        else vn.tables[tIdx] = { ...vn.tables[tIdx], title, headers, rows };

        Storage.save();
        UI.closeModal();
        UI.toast('Tabel berhasil disimpan!');
        this.render();

      // =========================================================================
      // 5. FITUR DIAGRAM INTERAKTIF (Clickable Nodes, SVG Lines, Full CRUD)
      // =========================================================================
      renderInteractiveDiagramTab(m, st) {
        const diag = m.diagram || { title: 'Diagram Konsep', nodes: [], edges: [] };
        if (!this.selectedNodeId && diag.nodes.length > 0) {
          this.selectedNodeId = diag.nodes[0].id;
        }
        const activeNode = diag.nodes.find(n => n.id === this.selectedNodeId) || diag.nodes[0];

        return `
          <div class="space-y-4">
            <div class="neo-card p-4 bg-white">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div>
                  <h3 class="font-display font-bold text-base">${diag.title}</h3>
                  <p class="text-xs text-gray-500">Klik kotak mana saja pada diagram untuk melihat detail keterangan dan relasinya.</p>
                </div>
                <button onclick="MateriDetail.openAddNodeModal()" class="neo-btn ${st.bg} ${m.category === 'TWK' ? 'text-white' : 'text-ink'} px-3 py-1.5 text-xs flex items-center gap-1">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Kotak Diagram
                </button>
              </div>

              <!-- Interactive Canvas Area with SVG Connectors -->
              <div class="relative w-full h-80 sm:h-96 rounded-2xl border-2 border-ink notebook-grid overflow-hidden select-none">
                <svg class="absolute inset-0 w-full h-full pointer-events-none">
                  ${(diag.edges || []).map(([fromId, toId]) => {
                    const n1 = diag.nodes.find(n => n.id === fromId);
                    const n2 = diag.nodes.find(n => n.id === toId);
                    if (!n1 || !n2) return '';
                    const isHighlighted = this.selectedNodeId === fromId || this.selectedNodeId === toId;
                    return `<line x1="${n1.x}%" y1="${n1.y}%" x2="${n2.x}%" y2="${n2.y}%" stroke="${isHighlighted ? '#12131A' : '#9CA3AF'}" stroke-width="${isHighlighted ? '3' : '2'}" stroke-dasharray="${isHighlighted ? '0' : '5,4'}" />`;
                  }).join('')}
                </svg>

                ${diag.nodes.map(node => {
                  const isSel = activeNode && activeNode.id === node.id;
                  return `
                    <button
                      onclick="MateriDetail.selectDiagramNode('${node.id}')"
                      style="left: ${node.x}%; top: ${node.y}%; transform: translate(-50%, -50%);"
                      class="absolute px-3 py-2 rounded-xl border-2 border-ink text-xs font-extrabold transition-all max-w-[140px] sm:max-w-[180px] text-center leading-tight cursor-pointer ${isSel ? `${st.bg} ${m.category === 'TWK' ? 'text-white' : 'text-ink'} node-selected z-20` : 'bg-white text-ink shadow-[2px_2px_0px_#12131A] hover:bg-gray-50 z-10'}">
                      ${node.label}
                    </button>
                  `;
                }).join('')}
              </div>

              <!-- Selected Node Inspector & CRUD Controls -->
              ${activeNode ? `
                <div class="mt-4 p-4 rounded-xl ${st.light} border-2 border-ink flex flex-col sm:flex-row sm:items-center justify-between gap-3 animate-pop">
                  <div class="space-y-1">
                    <div class="flex items-center gap-2">
                      <span class="px-2 py-0.5 rounded bg-ink text-white text-[10px] font-bold">Kotak Terpilih</span>
                      <h4 class="font-display font-bold text-sm sm:text-base">${activeNode.label}</h4>
                    </div>
                    <p class="text-xs sm:text-sm text-gray-800 leading-relaxed">${activeNode.desc}</p>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <button onclick="MateriDetail.openEditNodeModal('${activeNode.id}')" class="neo-btn bg-white px-3 py-1.5 text-xs flex items-center gap-1">
                      <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Edit Kotak
                    </button>
                    <button onclick="MateriDetail.deleteDiagramNode('${activeNode.id}')" class="neo-btn bg-red-500 text-white px-3 py-1.5 text-xs flex items-center gap-1">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Hapus
                    </button>
                  </div>
                </div>
              ` : '<p class="text-xs text-gray-500 mt-3">Belum ada kotak diagram.</p>'}
            </div>
          </div>
        `;
      },

      selectDiagramNode(nodeId) {
        this.selectedNodeId = nodeId;
        this.render();
      },

        const nodes = this.getMaterial().diagram.nodes || [];
        UI.openModal(`

      saveNewNode() {
        const diag = this.getMaterial().diagram;
        const label = document.getElementById('nd-label').value.trim();
        const desc = document.getElementById('nd-desc').value.trim() || 'Keterangan kotak diagram.';
        const x = Math.min(88, Math.max(12, parseInt(document.getElementById('nd-x').value) || 50));
        const y = Math.min(88, Math.max(12, parseInt(document.getElementById('nd-y').value) || 50));
        const connectTo = document.getElementById('nd-connect')?.value;

        if (!label) return UI.toast('Judul kotak wajib diisi', 'error');
        const id = 'nd-' + Date.now();
        diag.nodes.push({ id, label, x, y, desc });
        if (connectTo) diag.edges.push([connectTo, id]);

        this.selectedNodeId = id;
        Storage.save();
        UI.closeModal();
        UI.toast('Kotak diagram ditambahkan!');
        this.render();
      },

      deleteDiagramNode(nodeId) {
        const diag = this.getMaterial().diagram;
        diag.nodes = diag.nodes.filter(n => n.id !== nodeId);

      extractYoutubeId(url) {
        const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
        const match = url.match(reg);
        return match ? match[1] : null;
      },

        UI.openModal(`

            <h3 class="font-display font-bold text-base">Konfigurasi Passing Grade SKD</h3>
            <div class="grid grid-cols-3 gap-2 text-xs">
              <div><label class="font-bold">PG TWK</label><input id="cfg-twk" type="number" value="${this.config.pgTWK}" class="neo-input w-full mt-1" /></div>
              <div><label class="font-bold">PG TIU</label><input id="cfg-tiu" type="number" value="${this.config.pgTIU}" class="neo-input w-full mt-1" /></div>
              <div><label class="font-bold">PG TKP</label><input id="cfg-tkp" type="number" value="${this.config.pgTKP}" class="neo-input w-full mt-1" /></div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button onclick="UI.closeModal()" class="neo-btn bg-white px-4 py-2 text-xs">Batal</button>
              <button onclick="TryoutArena.saveConfig()" class="neo-btn bg-twk text-white px-4 py-2 text-xs">Simpan</button>
            </div>
          </div>
        `);
      },

      saveConfig() {
        this.config.pgTWK = parseInt(document.getElementById('cfg-twk').value) || 65;
        this.config.pgTIU = parseInt(document.getElementById('cfg-tiu').value) || 80;
        this.config.pgTKP = parseInt(document.getElementById('cfg-tkp').value) || 166;
        UI.closeModal();
        UI.toast('Konfigurasi passing grade diperbarui!');
        this.render();
      },

      startExam(cat) {
        const pool = Storage.state.tryoutQuestions.filter(q => cat === 'ALL' || q.category === cat);
        if (pool.length === 0) return UI.toast('Belum ada soal untuk kategori ini. Tambahkan di Bank Soal.', 'warn');

        this.examCategory = cat;
        this.examQuestions = JSON.parse(JSON.stringify(pool));
        this.currentIndex = 0;
        this.answers = {};
        this.flagged = {};
        this.secondsLeft = this.examQuestions.length * 60; // 1 menit per soal
        this.mode = 'exam';

        this.timerInterval = setInterval(() => {
          this.secondsLeft--;
          const timerEl = document.getElementById('cat-timer-display');
          if (timerEl) timerEl.textContent = this.formatTime(this.secondsLeft);
          if (this.secondsLeft <= 0) {
            clearInterval(this.timerInterval);
            this.finishExam();
          }
        }, 1000);

        this.render();
      },

      formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      },

      renderExam() {
        const q = this.examQuestions[this.currentIndex];
        const st = UI.getCategoryStyle(q.category);
        const letters = ['A', 'B', 'C', 'D', 'E'];
        const answeredCount = Object.keys(this.answers).length;

        return `
          <div class="space-y-4 animate-pop">
            <!-- Top CAT Bar -->
            <div class="neo-card p-3.5 bg-white flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-lg ${st.bg} ${q.category === 'TWK' ? 'text-white' : 'text-ink'} border border-ink text-xs font-extrabold">${q.category}</span>
                <span class="text-xs font-bold">Soal ${this.currentIndex + 1} / ${this.examQuestions.length}</span>
              </div>

              <div class="flex items-center gap-2">
                <div class="px-3 py-1 rounded-xl bg-ink text-white font-display font-bold text-sm flex items-center gap-1.5">
                  <i data-lucide="clock" class="w-4 h-4 text-tiu"></i>
                  <span id="cat-timer-display">${this.formatTime(this.secondsLeft)}</span>
                </div>
                <button onclick="TryoutArena.confirmFinish()" class="neo-btn bg-emerald-400 px-3 py-1.5 text-xs">
                  Selesai
                </button>
              </div>
            </div>

            <!-- Question Card -->
            <div class="neo-card p-5 bg-white space-y-4">
              <p class="text-sm sm:text-base font-semibold leading-relaxed">${q.question}</p>

              <div class="space-y-2.5">
                ${q.options.map((opt, idx) => {
                  const isSelected = this.answers[q.id] === idx;
                  return `
                    <button onclick="TryoutArena.selectAnswer('${q.id}', ${idx})"
                      class="w-full text-left p-3 rounded-xl border-2 border-ink text-xs sm:text-sm flex items-start gap-3 transition ${isSelected ? `${st.bg} ${q.category === 'TWK' ? 'text-white' : 'text-ink'} font-bold shadow-[2px_2px_0px_#12131A]` : 'bg-bgMain hover:bg-gray-100'}">
                      <span class="w-6 h-6 rounded-lg bg-white text-ink border border-ink font-extrabold text-xs flex items-center justify-center shrink-0">${letters[idx]}</span>
                      <span class="pt-0.5">${opt}</span>
                    </button>
                  `;
                }).join('')}
              </div>

              <!-- Prev / Flag / Next Controls -->
              <div class="pt-3 border-t border-gray-200 flex flex-wrap items-center justify-between gap-2">
                <button onclick="TryoutArena.goTo(${this.currentIndex - 1})" ${this.currentIndex === 0 ? 'disabled' : ''} class="neo-btn bg-white px-3.5 py-2 text-xs disabled:opacity-40 flex items-center gap-1">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i> Sebelumnya
                </button>

                <button onclick="TryoutArena.toggleFlag('${q.id}')" class="neo-btn ${this.flagged[q.id] ? 'bg-tiu' : 'bg-white'} px-3.5 py-2 text-xs flex items-center gap-1">
                  <i data-lucide="flag" class="w-3.5 h-3.5"></i> ${this.flagged[q.id] ? 'Ditandai Ragu' : 'Tandai Soal'}
                </button>

                ${this.currentIndex < this.examQuestions.length - 1 ? `
                  <button onclick="TryoutArena.goTo(${this.currentIndex + 1})" class="neo-btn bg-twk text-white px-3.5 py-2 text-xs flex items-center gap-1">
                    Selanjutnya <i data-lucide="chevron-right" class="w-4 h-4"></i>
                  </button>
                ` : `
                  <button onclick="TryoutArena.confirmFinish()" class="neo-btn bg-emerald-400 px-4 py-2 text-xs flex items-center gap-1">
                    Kumpulkan Ujian <i data-lucide="check" class="w-4 h-4"></i>
                  </button>
                `}
              </div>
            </div>

            <!-- Question Number Navigator -->
            <div class="neo-card p-4 bg-white">
              <div class="flex items-center justify-between text-xs font-bold mb-2.5">
                <span>Navigasi Nomor Soal</span>
                <span>Terjawab: ${answeredCount} / ${this.examQuestions.length}</span>
              </div>
              <div class="grid grid-cols-6 sm:grid-cols-10 gap-2">
                ${this.examQuestions.map((item, idx) => {
                  const isCurr = idx === this.currentIndex;
                  const isAns = this.answers[item.id] !== undefined;
                  const isFlg = this.flagged[item.id];
                  let bg = 'bg-white';
                  if (isFlg) bg = 'bg-tiu';
                  else if (isAns) bg = 'bg-twk text-white';

                  return `
                    <button onclick="TryoutArena.goTo(${idx})"
                      class="h-9 rounded-lg border-2 border-ink font-extrabold text-xs flex items-center justify-center ${bg} ${isCurr ? 'ring-2 ring-offset-1 ring-ink' : ''}">
                      ${idx + 1}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      },

      selectAnswer(qId, optIdx) {
        this.answers[qId] = optIdx;
        this.render();
      },

      toggleFlag(qId) {
        this.flagged[qId] = !this.flagged[qId];
        this.render();
      },

      goTo(idx) {
        if (idx >= 0 && idx < this.examQuestions.length) {
          this.currentIndex = idx;
          this.render();
        }
      },

      confirmFinish() {
        const unanswered = this.examQuestions.length - Object.keys(this.answers).length;
        UI.confirmDialog(
          "Akhiri Sesi Ujian?",
          unanswered > 0
            ? `Masih ada <strong>${unanswered} soal</strong> yang belum dijawab. Yakin ingin mengakhiri ujian dan melihat hasil analisis skor?`
            : "Seluruh soal telah dijawab. Akhiri ujian sekarang untuk melihat hasil dan pembahasan?",
          () => this.finishExam(),
          "Ya, Selesaikan Ujian",
          "bg-twk text-white"
        );
      },

      finishExam() {
        if (this.timerInterval) clearInterval(this.timerInterval);

        let twk = 0, tiu = 0, tkp = 0;
        let correct = 0, wrong = 0;
        const weakCategories = {};

        this.examQuestions.forEach(q => {
          const ans = this.answers[q.id];
          if (q.category === 'TWK') {
            if (ans === q.answer) { twk += this.config.twkCorrectPts; correct++; }
            else { wrong++; weakCategories['TWK'] = (weakCategories['TWK'] || 0) + 1; }
          } else if (q.category === 'TIU') {
            if (ans === q.answer) { tiu += this.config.tiuCorrectPts; correct++; }
            else { wrong++; weakCategories['TIU'] = (weakCategories['TIU'] || 0) + 1; }
          } else if (q.category === 'TKP') {
            const pts = (ans !== undefined && q.scores) ? (q.scores[ans] || 1) : 0;
            tkp += pts;
            if (pts === 5) correct++;
            else { wrong++; weakCategories['TKP'] = (weakCategories['TKP'] || 0) + 1; }
          }
        });

        const total = twk + tiu + tkp;
        const today = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

        this.lastResult = {
          date: today,
          kategori: this.examCategory === 'ALL' ? 'Simulasi SKD' : `Latihan ${this.examCategory}`,
          twk, tiu, tkp, total, correct, wrong,
          weakCategories,
          questions: this.examQuestions,
          userAnswers: { ...this.answers }
        };

        Storage.state.profile.tryoutHistory.push({
          id: 'to-' + Date.now(),
          date: today,
          kategori: this.lastResult.kategori,
          twk, tiu, tkp, total,
          passed: total >= Storage.state.profile.targetScore
        });
        Storage.state.profile.totalStudyMinutes += Math.max(5, Math.round(this.examQuestions.length * 0.8));
        Storage.save();

        this.mode = 'result';
        this.render();
      },

      renderResult() {
        const r = this.lastResult;
        if (!r) return this.setMode('lobby');
        const letters = ['A', 'B', 'C', 'D', 'E'];

        // Determine weakest subtest
        const sortedWeak = Object.entries(r.weakCategories).sort((a, b) => b[1] - a[1]);
        const weakestCat = sortedWeak[0]?.[0] || 'TWK';
        const recommendedMaterials = Storage.state.materials.filter(m => m.category === weakestCat);

        return `
          <div class="space-y-5 animate-pop">
            <div class="neo-card p-5 bg-white text-center space-y-3">
              <span class="px-3 py-1 rounded-full bg-twkLight border border-ink text-xs font-extrabold text-twk">HASIL EVALUASI TRYOUT</span>
              <h1 class="font-display font-bold text-3xl sm:text-4xl">Total Skor: ${r.total}</h1>
              <p class="text-xs text-gray-600">Benar / Poin Maksimal: <strong>${r.correct}</strong> • Kurang Tepat: <strong>${r.wrong}</strong></p>

              <div class="grid grid-cols-3 gap-2.5 pt-2">
                <div class="p-3 rounded-xl bg-twkLight border-2 border-ink">
                  <p class="text-[11px] font-bold">Skor TWK</p>
                  <p class="font-display font-bold text-xl">${r.twk}</p>
                </div>
                <div class="p-3 rounded-xl bg-tiuLight border-2 border-ink">
                  <p class="text-[11px] font-bold">Skor TIU</p>
                  <p class="font-display font-bold text-xl">${r.tiu}</p>
                </div>
                <div class="p-3 rounded-xl bg-tkpLight border-2 border-ink">
                  <p class="text-[11px] font-bold">Skor TKP</p>
                  <p class="font-display font-bold text-xl">${r.tkp}</p>
                </div>
              </div>

              <div class="pt-2 flex justify-center gap-2">
                <button onclick="TryoutArena.setMode('lobby')" class="neo-btn bg-white px-4 py-2 text-xs">Kembali ke Lobby</button>
                <button onclick="TryoutArena.startExam('${this.examCategory}')" class="neo-btn bg-twk text-white px-4 py-2 text-xs">Ulangi Tryout</button>
              </div>
            </div>

            <!-- Weakness Analysis & Material Recommendation -->
            <div class="neo-card p-4 bg-tiuLight space-y-3">
              <h3 class="font-display font-bold text-base flex items-center gap-2">
                <i data-lucide="target" class="w-4 h-4"></i> Analisis Kelemahan & Rekomendasi Belajar
              </h3>
              <p class="text-xs text-gray-800">
                Subtes dengan poin hilang terbanyak pada sesi ini adalah <strong>${weakestCat}</strong>. Pelajari kembali modul berikut untuk mendongkrak skormu:
              </p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${recommendedMaterials.map(rm => `
                  <div onclick="App.openMaterial('${rm.id}')" class="neo-card-sm p-3 bg-white cursor-pointer flex items-center justify-between">
                    <span class="text-xs font-bold">${rm.title}</span>
                    <span class="text-[11px] font-extrabold text-twk">Pelajari →</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Full Answer Explanations -->
            <div class="space-y-3">
              <h3 class="font-display font-bold text-base">Pembahasan Lengkap Setiap Soal</h3>
              ${r.questions.map((q, idx) => {
                const uAns = r.userAnswers[q.id];
                const isTkp = q.category === 'TKP';
                const bestIdx = isTkp ? q.scores.indexOf(5) : q.answer;
                const isRight = uAns === bestIdx;

                return `
                  <div class="neo-card p-4 bg-white space-y-2 text-xs">
                    <div class="flex items-center justify-between">
                      <span class="font-extrabold">Soal #${idx + 1} (${q.category})</span>
                      <span class="px-2 py-0.5 rounded font-bold ${isRight ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                        ${isTkp ? `Skor Diperoleh: ${uAns !== undefined ? q.scores[uAns] : 0}/5` : (isRight ? 'Benar (+5)' : 'Salah (0)')}
                      </span>
                    </div>
                    <p class="font-semibold text-sm">${q.question}</p>
                    <p class="text-gray-600">Jawabanmu: <strong>${uAns !== undefined ? `${letters[uAns]}. ${q.options[uAns]}` : 'Tidak dijawab'}</strong></p>
                    <p class="text-emerald-800">Jawaban Optimal: <strong>${letters[bestIdx]}. ${q.options[bestIdx]}</strong></p>
                    <div class="p-2.5 rounded-lg bg-bgMain border border-ink/20 text-gray-800">
                      <strong>Pembahasan:</strong> ${q.explanation}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      },

      // CRUD Question Bank for Tryout
      renderQuestionBank() {
        const list = Storage.state.tryoutQuestions;
        return `
          <div class="space-y-4 animate-pop">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <button onclick="TryoutArena.setMode('lobby')" class="neo-btn bg-white px-3.5 py-2 text-xs flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Lobby Tryout
              </button>
              <button onclick="TryoutArena.openQuestionModal(-1)" class="neo-btn bg-twk text-white px-3.5 py-2 text-xs flex items-center gap-1">
                <i data-lucide="plus" class="w-4 h-4"></i> Tambah Soal Tryout
              </button>
            </div>

            <div class="space-y-3">
              ${list.map((q, idx) => `
                <div class="neo-card p-4 bg-white flex items-start justify-between gap-3">
                  <div class="space-y-1 text-xs">
                    <span class="px-2 py-0.5 rounded bg-bgMain border border-ink font-extrabold">${q.category}</span>
                    <p class="font-bold text-sm mt-1">${q.question}</p>
                    <p class="text-gray-500">${q.explanation}</p>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="TryoutArena.openQuestionModal(${idx})" class="neo-btn bg-white p-2 text-xs"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                    <button onclick="TryoutArena.deleteTryoutQ(${idx})" class="neo-btn bg-red-500 text-white p-2 text-xs"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      },

      openQuestionModal(idx) {
        const q = idx >= 0 ? Storage.state.tryoutQuestions[idx] : {
          category: 'TWK',
          question: '',
          options: ['', '', '', '', ''],
          answer: 0,
          scores: [5, 4, 3, 2, 1],
          explanation: ''
        };
        UI.openModal(`
          <div class="space-y-3">
            <h3 class="font-display font-bold text-base">${idx >= 0 ? 'Edit Soal Tryout' : 'Tambah Soal Tryout Baru'}</h3>
            <div>
              <label class="text-xs font-bold">Kategori</label>
              <select id="to-q-cat" class="neo-input w-full text-xs font-bold mt-1">
                <option value="TWK" ${q.category === 'TWK' ? 'selected' : ''}>TWK</option>
                <option value="TIU" ${q.category === 'TIU' ? 'selected' : ''}>TIU</option>
                <option value="TKP" ${q.category === 'TKP' ? 'selected' : ''}>TKP (Bobot 1-5)</option>
              </select>
            </div>
            <textarea id="to-q-text" rows="3" placeholder="Tulis narasi soal..." class="neo-input w-full text-xs">${q.question}</textarea>
            <div class="space-y-1.5 text-xs">
              ${[0,1,2,3,4].map(i => `<input id="to-q-o${i}" value="${q.options[i] || ''}" placeholder="Pilihan ${['A','B','C','D','E'][i]}" class="neo-input w-full" />`).join('')}
            </div>
            <div>
              <label class="text-xs font-bold">Jawaban Benar (Untuk TWK/TIU) atau Opsi Skor 5 (Untuk TKP)</label>
              <select id="to-q-ans" class="neo-input w-full text-xs font-bold mt-1">
                ${['A','B','C','D','E'].map((l, i) => `<option value="${i}" ${(q.answer === i || (q.scores && q.scores[i] === 5)) ? 'selected' : ''}>Opsi ${l}</option>`).join('')}
              </select>
            </div>
            <textarea id="to-q-exp" rows="2" placeholder="Pembahasan lengkap..." class="neo-input w-full text-xs">${q.explanation}</textarea>
            <div class="flex justify-end gap-2">
              <button onclick="UI.closeModal()" class="neo-btn bg-white px-4 py-2 text-xs">Batal</button>
              <button onclick="TryoutArena.saveTryoutQ(${idx})" class="neo-btn bg-twk text-white px-4 py-2 text-xs">Simpan Soal</button>
            </div>
          </div>
        `);
      },

      saveTryoutQ(idx) {
        const category = document.getElementById('to-q-cat').value;
        const question = document.getElementById('to-q-text').value.trim();
        const options = [0,1,2,3,4].map(i => document.getElementById(`to-q-o${i}`).value.trim() || `Opsi ${i+1}`);
        const ans = parseInt(document.getElementById('to-q-ans').value);
        const explanation = document.getElementById('to-q-exp').value.trim() || 'Pembahasan soal.';

        if (!question) return UI.toast('Narasi soal wajib diisi', 'error');

        const scores = [1, 2, 3, 4, 2];
        scores[ans] = 5;

        const obj = {
          id: idx >= 0 ? Storage.state.tryoutQuestions[idx].id : 'cat-' + Date.now(),
          category,
          question,
          options,
          answer: ans,
          scores,
          explanation
        };

        if (idx === -1) Storage.state.tryoutQuestions.push(obj);
        else Storage.state.tryoutQuestions[idx] = obj;

        Storage.save();
        UI.closeModal();
        UI.toast('Bank soal tryout diperbarui!');
        this.render();
      },

      deleteTryoutQ(idx) {
        Storage.state.tryoutQuestions.splice(idx, 1);
        Storage.save();
        UI.toast('Soal dihapus dari bank tryout', 'warn');
        this.render();
      }
    };

    /**
     * 7. HALAMAN CARI MATERI & ISTILAH GLOBAL
     */
    const GlobalSearch = {
      query: '',

      render() {
        const q = this.query.toLowerCase().trim();
        const matResults = Storage.state.materials.filter(m =>
          !q ||
          m.title.toLowerCase().includes(q) ||
          m.shortDesc.toLowerCase().includes(q) ||
          m.keyPoints.some(k => k.toLowerCase().includes(q)) ||
          m.tipsTricks.some(t => t.toLowerCase().includes(q))
        );
        const glosResults = Storage.state.glossary.filter(g =>
          !q || g.term.toLowerCase().includes(q) || g.def.toLowerCase().includes(q)
        );

        document.getElementById('app-root').innerHTML = `
          <div class="space-y-5 animate-pop">
            <div class="neo-card p-5 bg-white">
              <h1 class="font-display font-bold text-xl sm:text-2xl">Cari Materi, Trik & Istilah</h1>
              <p class="text-xs text-gray-600 mt-1">Telusuri seluruh modul TWK, TIU, TKP, dan kamus istilah CPNS dalam satu pencarian.</p>
              <div class="mt-3 relative">
                <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input id="global-search-box" type="text" value="${this.query}" oninput="GlobalSearch.update(this.value)"
                  placeholder="Ketik kata kunci: Silogisme, Integritas, Gratifikasi, Modus Tollens..."
                  class="neo-input w-full pl-10 text-sm" />
              </div>
            </div>

            <div class="space-y-3">
              <h2 class="font-display font-bold text-base">Modul Materi Ditemukan (${matResults.length})</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${matResults.map(m => {
                  const st = UI.getCategoryStyle(m.category);
                  return `
                    <div onclick="App.openMaterial('${m.id}')" class="neo-card p-4 bg-white cursor-pointer hover:-translate-y-0.5">
                      <span class="px-2 py-0.5 rounded text-[10px] font-extrabold ${st.light} border border-ink">${m.category}</span>
                      <h3 class="font-bold text-sm mt-1.5">${m.title}</h3>
                      <p class="text-xs text-gray-600 line-clamp-2 mt-1">${m.shortDesc}</p>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="space-y-3">
              <h2 class="font-display font-bold text-base">Istilah Glosarium Terkait (${glosResults.length})</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${glosResults.slice(0, 6).map(g => `
                  <div class="neo-card-sm p-3.5 bg-white">
                    <div class="flex items-center justify-between">
                      <strong class="text-sm text-twk">${g.term}</strong>
                      <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-bgMain border border-ink">${g.category}</span>
                    </div>
                    <p class="text-xs text-gray-700 mt-1">${g.def}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();
      },

      update(val) {
        this.query = val;
        this.render();
        const box = document.getElementById('global-search-box');
        if (box) {
          box.focus();
          box.setSelectionRange(val.length, val.length);
        }
      }
    };

    /**
     * 8. GLOSARIUM CPNS (Filter Kategori, Filter Alfabet, Pencarian, Tambah Istilah)
     */
    const GlosariumPage = {
      search: '',
      letter: 'ALL',
      cat: 'ALL',

      render() {
        const list = Storage.state.glossary.filter(item => {
          const matchS = !this.search || item.term.toLowerCase().includes(this.search.toLowerCase()) || item.def.toLowerCase().includes(this.search.toLowerCase());
          const matchL = this.letter === 'ALL' || item.term.toUpperCase().startsWith(this.letter);
          const matchC = this.cat === 'ALL' || item.category === this.cat;
          return matchS && matchL && matchC;
        }).sort((a, b) => a.term.localeCompare(b.term));

        const categories = ['ALL', 'Ketatanegaraan', 'Pancasila', 'Sejarah', 'Pemerintahan', 'Psikologi & Perilaku', 'Numerik & Verbal'];
        const letters = ['ALL', 'A', 'B', 'C', 'D', 'G', 'I', 'M', 'O', 'R', 'S'];

        document.getElementById('app-root').innerHTML = `
          <div class="space-y-4 animate-pop">
            <div class="neo-card p-5 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h1 class="font-display font-bold text-xl sm:text-2xl">Glosarium & Kamus Istilah CPNS</h1>
                <p class="text-xs text-gray-600 mt-1">Kumpulan istilah penting ketatanegaraan, Pancasila, sejarah, pemerintahan, psikologi, dan logika.</p>
              </div>
              <button onclick="GlosariumPage.openAddModal()" class="neo-btn bg-twk text-white px-3.5 py-2 text-xs flex items-center gap-1 shrink-0">
                <i data-lucide="plus" class="w-4 h-4"></i> Tambah Istilah
              </button>
            </div>

            <!-- Search & Category Filter -->
            <div class="neo-card p-4 bg-white space-y-3">
              <input id="glos-search" type="text" value="${this.search}" oninput="GlosariumPage.setSearch(this.value)"
                placeholder="Cari istilah (misal: Amandemen, Gratifikasi, Silogisme)..." class="neo-input w-full text-xs sm:text-sm" />

              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
                ${categories.map(c => `
                  <button onclick="GlosariumPage.setCat('${c}')"
                    class="px-3 py-1 rounded-lg text-[11px] font-bold border border-ink whitespace-nowrap ${this.cat === c ? 'bg-ink text-white' : 'bg-bgMain text-ink'}">
                    ${c === 'ALL' ? 'Semua Bidang' : c}
                  </button>
                `).join('')}
              </div>

              <!-- Alphabet Filter -->
              <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
                ${letters.map(l => `
                  <button onclick="GlosariumPage.setLetter('${l}')"
                    class="w-7 h-7 rounded-lg text-[11px] font-extrabold border border-ink shrink-0 ${this.letter === l ? 'bg-tiu text-ink' : 'bg-white'}">
                    ${l === 'ALL' ? '★' : l}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Terms List -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${list.length === 0 ? `<div class="neo-card p-6 text-center text-xs text-gray-500 col-span-2">Istilah tidak ditemukan.</div>` : list.map(g => `
                <div class="neo-card p-4 bg-white space-y-1.5">
                  <div class="flex items-center justify-between gap-2">
                    <h3 class="font-display font-bold text-base text-twk">${g.term}</h3>
                    <span class="px-2 py-0.5 rounded-md bg-tkpLight border border-ink text-[10px] font-bold">${g.category}</span>
                  </div>
                  <p class="text-xs sm:text-sm text-gray-700 leading-relaxed">${g.def}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        lucide.createIcons();
      },

      setSearch(v) {
        this.search = v;
        this.render();
        const el = document.getElementById('glos-search');
        if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
      },
      setCat(c) { this.cat = c; this.render(); },
      setLetter(l) { this.letter = l; this.render(); },

      openAddModal() {
        UI.openModal(`
          <div class="space-y-3">
            <h3 class="font-display font-bold text-base">Tambah Istilah Glosarium</h3>
            <input id="gl-term" placeholder="Nama Istilah" class="neo-input w-full text-xs font-bold" />
            <select id="gl-cat" class="neo-input w-full text-xs font-bold">
              <option>Ketatanegaraan</option>
              <option>Pancasila</option>
              <option>Sejarah</option>
              <option>Pemerintahan</option>
              <option>Psikologi & Perilaku</option>
              <option>Numerik & Verbal</option>
            </select>
            <textarea id="gl-def" rows="3" placeholder="Definisi istilah..." class="neo-input w-full text-xs"></textarea>
            <div class="flex justify-end gap-2">
              <button onclick="UI.closeModal()" class="neo-btn bg-white px-4 py-2 text-xs">Batal</button>
              <button onclick="GlosariumPage.saveNew()" class="neo-btn bg-twk text-white px-4 py-2 text-xs">Simpan</button>
            </div>
          </div>
        `);
      },

      saveNew() {
        const term = document.getElementById('gl-term').value.trim();
        const category = document.getElementById('gl-cat').value;
        const def = document.getElementById('gl-def').value.trim();
        if (!term || !def) return UI.toast('Istilah dan definisi wajib diisi', 'error');
        Storage.state.glossary.push({ term, category, def });
        Storage.save();
        UI.closeModal();
        UI.toast('Istilah ditambahkan ke Glosarium!');
        this.render();
      }
    };

    /**
     * 9. HALAMAN PROFIL, GRAFIK SKOR TRYOUT & PENGATURAN
     */
    const ProfilPage = {
      tryoutChart: null,

      render() {
        const { profile, materials } = Storage.state;
        const completedCount = materials.filter(m => m.progress === 100 || m.status === 'selesai').length;
        const unmastered = materials.filter(m => m.progress < 70);

        document.getElementById('app-root').innerHTML = `
          <div class="space-y-5 animate-pop">
            <!-- Profile Card -->
            <div class="neo-card p-5 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div class="flex items-center gap-3.5">
                <div class="w-14 h-14 rounded-2xl bg-tkp border-2 border-ink shadow-[3px_3px_0px_#12131A] flex items-center justify-center font-display font-bold text-xl">
                  ${profile.name.substring(0, 2).toUpperCase()}
                </div>
                <div>
                  <h1 class="font-display font-bold text-xl">${profile.name}</h1>
                  <p class="text-xs text-gray-600">Target Skor SKD: <strong>${profile.targetScore} / 550</strong> • Target Harian: <strong>${profile.dailyGoalMinutes} menit</strong></p>
                </div>
              </div>
              <button onclick="ProfilPage.openEditProfileModal()" class="neo-btn bg-twk text-white px-4 py-2 text-xs flex items-center gap-1.5 self-start sm:self-auto">
                <i data-lucide="settings" class="w-4 h-4"></i> Atur Profil & Target
              </button>
            </div>

            <!-- Summary Metrics -->
            <div class="grid grid-cols-3 gap-3">
              <div class="neo-card p-3.5 bg-twkLight text-center">
                <p class="text-[11px] font-bold text-gray-700">Total Jam Belajar</p>
                <p class="font-display font-bold text-xl mt-0.5">${(profile.totalStudyMinutes / 60).toFixed(1)} Jam</p>
              </div>
              <div class="neo-card p-3.5 bg-tiuLight text-center">
                <p class="text-[11px] font-bold text-gray-700">Materi Selesai</p>
                <p class="font-display font-bold text-xl mt-0.5">${completedCount} / ${materials.length}</p>
              </div>
              <div class="neo-card p-3.5 bg-tkpLight text-center">
                <p class="text-[11px] font-bold text-gray-700">Total Tryout</p>
                <p class="font-display font-bold text-xl mt-0.5">${profile.tryoutHistory.length}x</p>
              </div>
            </div>

            <!-- Tryout Score Progression Chart -->
            <div class="neo-card p-4 bg-white">
              <h2 class="font-display font-bold text-base mb-2 flex items-center gap-2">
                <i data-lucide="line-chart" class="w-4 h-4 text-twk"></i> Grafik Perkembangan Skor Tryout
              </h2>
              <div class="h-48 w-full">
                <canvas id="tryout-score-chart"></canvas>
              </div>
            </div>

            <!-- Unmastered Materials & Tryout History -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="neo-card p-4 bg-white space-y-2.5">
                <h3 class="font-display font-bold text-sm flex items-center gap-1.5">
                  <i data-lucide="alert-circle" class="w-4 h-4 text-tiu"></i> Materi Belum Dikuasai (&lt; 70%)
                </h3>
                ${unmastered.length === 0 ? `<p class="text-xs text-emerald-700 font-bold">Semua materi sudah di atas 70%!</p>` : unmastered.map(m => `
                  <div onclick="App.openMaterial('${m.id}')" class="p-2.5 rounded-xl bg-bgMain border border-ink flex items-center justify-between cursor-pointer text-xs">
                    <span class="font-bold truncate pr-2">${m.title}</span>
                    <span class="px-2 py-0.5 rounded bg-white border border-ink font-extrabold shrink-0">${m.progress}%</span>
                  </div>
                `).join('')}
              </div>

              <div class="neo-card p-4 bg-white space-y-2.5">
                <h3 class="font-display font-bold text-sm flex items-center gap-1.5">
                  <i data-lucide="history" class="w-4 h-4 text-twk"></i> Riwayat Skor Tryout
                </h3>
                <div class="space-y-2 max-h-48 overflow-y-auto">
                  ${[...profile.tryoutHistory].reverse().map(h => `
                    <div class="p-2.5 rounded-xl bg-bgMain border border-ink flex items-center justify-between text-xs">
                      <div>
                        <p class="font-bold">${h.kategori} <span class="text-gray-500 font-normal">(${h.date})</span></p>
                        <p class="text-[11px] text-gray-600">TWK: ${h.twk} • TIU: ${h.tiu} • TKP: ${h.tkp}</p>
                      </div>
                      <span class="px-2.5 py-1 rounded-lg bg-twk text-white border border-ink font-display font-bold">${h.total}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Future Account Auth Preview & Reset Progress -->
            <div class="neo-card p-4 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-tkpLight border border-ink">Cloud Sync (Segera Hadir)</span>
                <p class="text-xs text-gray-600 mt-1">Saat ini progres tersimpan otomatis di perangkatmu (LocalStorage). Fitur sinkronisasi akun cloud sedang disiapkan.</p>
              </div>
              <button onclick="ProfilPage.confirmReset()" class="neo-btn bg-red-500 text-white px-4 py-2 text-xs shrink-0">
                Reset Semua Progres
              </button>
            </div>
          </div>
        `;

        lucide.createIcons();
        this.renderChart();
      },

      renderChart() {
        const ctx = document.getElementById('tryout-score-chart');
        if (!ctx) return;
        if (this.tryoutChart) this.tryoutChart.destroy();

        const hist = Storage.state.profile.tryoutHistory;
        this.tryoutChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: hist.map(h => h.date),
            datasets: [{
              label: 'Total Skor SKD',
              data: hist.map(h => h.total),
              borderColor: '#35AAA9',
              backgroundColor: 'rgba(53, 170, 169, 0.2)',
              borderWidth: 3,
              pointBackgroundColor: '#FFB65E',
              pointBorderColor: '#12131A',
              pointBorderWidth: 2,
              pointRadius: 5,
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { min: 200, max: 550, ticks: { font: { weight: 'bold', size: 11 } } },
              x: { ticks: { font: { weight: 'bold', size: 11 } } }
            }
          }
        });
      },

      openEditProfileModal() {
        const p = Storage.state.profile;
        UI.openModal(`
          <div class="space-y-3">
            <h3 class="font-display font-bold text-base">Pengaturan Profil & Target Belajar</h3>
            <div>
              <label class="text-xs font-bold">Nama Panggilan Pejuang NIP</label>
              <input id="prof-name" type="text" value="${p.name}" class="neo-input w-full text-xs font-bold mt-1" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs font-bold">Target Skor SKD (Max 550)</label>
                <input id="prof-target" type="number" max="550" value="${p.targetScore}" class="neo-input w-full text-xs mt-1" />
              </div>
              <div>
                <label class="text-xs font-bold">Target Belajar Harian (Menit)</label>
                <input id="prof-daily" type="number" value="${p.dailyGoalMinutes}" class="neo-input w-full text-xs mt-1" />
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button onclick="UI.closeModal()" class="neo-btn bg-white px-4 py-2 text-xs">Batal</button>
              <button onclick="ProfilPage.saveProfile()" class="neo-btn bg-twk text-white px-4 py-2 text-xs">Simpan Pengaturan</button>
            </div>
          </div>
        `);
      },

      saveProfile() {
        const p = Storage.state.profile;
        p.name = document.getElementById('prof-name').value.trim() || 'Pejuang NIP 2026';
        p.targetScore = Math.min(550, Math.max(200, parseInt(document.getElementById('prof-target').value) || 450));
        p.dailyGoalMinutes = Math.max(10, parseInt(document.getElementById('prof-daily').value) || 60);
        document.getElementById('header-target-score').textContent = `${p.targetScore}+`;
        Storage.save();
        UI.closeModal();
        UI.toast('Profil & target belajar diperbarui!');
        this.render();
      },

      confirmReset() {
        UI.confirmDialog(
          "Reset Seluruh Data & Progres?",
          "Seluruh progres materi, catatan kustom, riwayat tryout, dan pengaturan akan dikembalikan ke data awal.",
          () => {
            Storage.reset();
            document.getElementById('header-target-score').textContent = `${Storage.state.profile.targetScore}+`;
            UI.toast('Progres berhasil direset ke awal', 'warn');
            this.render();
          },
          "Ya, Reset Sekarang"
        );
      }
    };

    /**
     * 10. MAIN APPLICATION ROUTER & INITIALIZER
     */
    const App = {
      currentRoute: 'dashboard',

      init() {
        Storage.init();
        document.getElementById('header-target-score').textContent = `${Storage.state.profile.targetScore}+`;
        this.navigate('dashboard');
      },

      navigate(route) {
        this.currentRoute = route;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        this.updateActiveNav(route);

        if (route === 'dashboard') Dashboard.render();
        else if (route === 'tryout') TryoutArena.render();
        else if (route === 'search') GlobalSearch.render();
        else if (route === 'glosarium') GlosariumPage.render();
        else if (route === 'profil') ProfilPage.render();
      },

      openMaterial(id) {
        this.currentRoute = 'detail';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        this.updateActiveNav('dashboard');
        MateriDetail.open(id);
      },

      updateActiveNav(route) {
        // Update Desktop Nav
        document.querySelectorAll('.nav-desktop-btn').forEach(btn => {
          const isMatch = btn.dataset.nav === route;
          btn.classList.toggle('bg-twk', isMatch);
          btn.classList.toggle('text-white', isMatch);
          btn.classList.toggle('border-ink', isMatch);
          btn.classList.toggle('shadow-[2px_2px_0px_#12131A]', isMatch);
        });

        // Update Mobile Bottom Nav
        document.querySelectorAll('.bnav-btn').forEach(btn => {
          const isMatch = btn.dataset.bnav === route;
          const wrap = btn.querySelector('.bnav-icon-wrap');
          if (isMatch) {
            wrap.classList.add('bg-twk', 'text-white', 'border', 'border-ink', 'shadow-[2px_2px_0px_#12131A]', '-translate-y-0.5');
            btn.classList.add('text-ink');
          } else {
            wrap.classList.remove('bg-twk', 'text-white', 'border', 'border-ink', 'shadow-[2px_2px_0px_#12131A]', '-translate-y-0.5');
            btn.classList.remove('text-ink');
          }
        });
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
